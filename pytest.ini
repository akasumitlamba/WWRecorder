[pytest]
testpaths = tests
norecursedirs = linux work artifacts Supporting .git
pythonpath = app
cache_dir = work/caches/pytest
# Feature markers for tests/windows_e2e (also registered in that package's conftest).
markers =
    feature_recording: Recording / capture engine contracts
    feature_screenshot: Screenshot flow contracts
    feature_audio: Microphone / system audio / WASAPI
    feature_annotation: Annotation contracts
    feature_editor: Video editor / export
    feature_playback: Playback / fullscreen
    feature_hotkeys: Global hotkeys
    feature_ui: Dock / panels / chrome
    feature_settings: Settings schema / drafts
    feature_distribution: EXE vs MSIX / updater
    feature_startup: Start with Windows seams
    feature_keycast: Keycast overlay
    feature_geometry: Multi-monitor / DPI
    feature_icons: Icons / cursors
    feature_processing: Processing notice
    feature_files: File ops / path safety
    pure_logic: No GUI interaction required
    windows_gui: Interactive Windows desktop GUI
    windows_native: win32 / WASAPI / WinRT
    harness: E2E harness self-checks
    behavior_question: Documented intent; may skip if code contradicts docs
